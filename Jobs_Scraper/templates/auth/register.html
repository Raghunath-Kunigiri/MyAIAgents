{% extends "base.html" %}

{% block title %}Register - JobTracker Pro{% endblock %}

{% block auth_content %}
<div style="text-align: center; margin-bottom: 2rem;">
    <h2 style="font-size: 1.75rem; color: var(--text-heading); margin-bottom: 0.5rem;">Create Account</h2>
    <p style="color: var(--secondary);">Start tracking your career journey</p>
</div>

<form method="POST">
    <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-input" placeholder="John Doe" required>
    </div>
    <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="name@company.com" required>
    </div>
    <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="At least 6 characters" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign Up</button>
</form>

<div style="margin-top: 2rem; text-align: center; padding-top: 1.5rem; border-top: 1px solid var(--border);">
    <p style="font-size: 0.9rem; color: var(--secondary);">
        Already have an account? <a href="{{ url_for('auth.login') }}"
            style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
    </p>
</div>
{% endblock %}
